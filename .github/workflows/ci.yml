name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # src/server.js falls back to /bin/zsh when SHELL is unset; zsh is not
      # installed on ubuntu-latest. Bash is the default login shell on the
      # runner, so mirror that explicitly to keep the spawned PTY healthy.
      SHELL: /bin/bash
    steps:
      - uses: actions/checkout@v4

      # node-pty is a native addon with no prebuilt binaries — it compiles
      # via node-gyp on install. ubuntu-latest ships build-essential by
      # default, but install explicitly so a runner image change can never
      # break the build silently.
      - name: Install build tools (for node-pty native compile)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential python3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # The suite above tests the checkout. This installs the packed tarball the
      # way a user does (with install scripts ignored) and exercises the
      # installed application: engine assets, data-directory modes, a live PTY,
      # and a browser pane. It is the gate that would have caught a dev tree
      # masquerading as an application.
      - name: Package install gate
        run: npm run test:package

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to a stable major tag instead of @master so a breaking
      # change upstream can't silently turn CI red.
      - name: Run shellcheck on scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './scripts'
          severity: warning

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the container
        run: docker build -t townmouse:ci .

      - name: Start and probe /health
        run: |
          docker run -d --name townmouse-ci -p 127.0.0.1:11001:11001 townmouse:ci
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11001/health >/dev/null; then
              echo "container is healthy after ${attempt} attempts"
              exit 0
            fi
            sleep 2
            if ! docker inspect -f '{{.State.Running}}' townmouse-ci | grep -q true; then
              docker logs townmouse-ci
              exit 1
            fi
          done
          docker logs townmouse-ci
          exit 1

      - name: Stop the container
        if: always()
        run: docker rm -f townmouse-ci || true
