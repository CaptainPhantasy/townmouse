name: Publish

# Trusted Publishing: no npm token is stored. The workflow exchanges a
# short-lived GitHub OIDC token for publish rights, and npm records provenance
# tying the tarball to this repository and commit.
#
# One-time setup, after the package exists on npm:
#   npmjs.com -> townmouse -> Settings -> Trusted publishing -> GitHub Actions
#   Owner: CaptainPhantasy   Repository: townmouse
#   Workflow filename: publish.yml   Environment: (leave blank)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SHELL: /bin/bash
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (node-pty native compile)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential python3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Install and test with the runner's npm (10.x), which runs dependency
      # install scripts and therefore builds node-pty. Upgrading first would
      # skip that build and break the suite on Linux.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package install gate
        run: npm run test:package

      # Trusted publishing needs npm 11.5.1 or newer; upgrade after the tests.
      - name: Use npm with trusted publishing support
        run: npm install -g npm@latest

      - name: Publish with provenance
        run: npm publish --provenance --access public
